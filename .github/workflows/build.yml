name: Build EduPython

# Builds ready-to-run downloads with Python + pygame-ce, numpy and matplotlib built in:
#   EduPython-windows-x64.exe   (portable, no installer)
#   EduPython-macos-arm64.dmg   (Apple Silicon)
#   EduPython-macos-x64.dmg     (Intel Macs)
#   EduPython-linux-x64.tar.gz  (64-bit Linux)
#   EduPython-windows-x64.msix  (for the Microsoft Store, which signs it)
# Push a tag like `v2.0.0` to publish them as a GitHub release.

on:
  push:
    tags: ['v2*']
    branches: [main]
    paths-ignore: ['**.md']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: EduPython-windows-x64.exe
          - os: macos-15   # Apple Silicon; macos-14 jobs were being cancelled
            target: aarch64-apple-darwin
            artifact: EduPython-macos-arm64.dmg
          - os: macos-15-intel   # macos-13 runners were retired
            target: x86_64-apple-darwin
            artifact: EduPython-macos-x64.dmg
          - os: ubuntu-22.04     # older glibc, so the build runs on more distributions
            target: x86_64-unknown-linux-gnu
            artifact: EduPython-linux-x64.tar.gz
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: . -> target

      - name: Linux build libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libwayland-dev libx11-dev libxcursor-dev libxrandr-dev libxi-dev libgl1-mesa-dev

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Prepare built-in Python with its packages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python packaging/prepare_python.py ${{ matrix.target }} "$PWD/python-runtime.zip"

      - name: Test
        run: cargo test --release --target ${{ matrix.target }}

      - name: Build
        run: |
          export EDUPYTHON_PYTHON_ZIP="$PWD/python-runtime.zip"
          cargo build --release --target ${{ matrix.target }} --features bundled-python
          mkdir -p dist

      - name: Package (Windows)
        if: runner.os == 'Windows'
        run: cp target/${{ matrix.target }}/release/edupython.exe dist/${{ matrix.artifact }}

      # Microsoft Store package. Uploaded by hand in Partner Center; the Store
      # signs it, so Store installs show no SmartScreen warning.
      - name: Package MSIX (Windows)
        if: runner.os == 'Windows'
        env:
          MSIX_IDENTITY_NAME: ${{ vars.MSIX_IDENTITY_NAME }}
          MSIX_PUBLISHER: ${{ vars.MSIX_PUBLISHER }}
          MSIX_PUBLISHER_DISPLAY_NAME: ${{ vars.MSIX_PUBLISHER_DISPLAY_NAME }}
        run: |
          version=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          python packaging/windows/make_msix.py target/${{ matrix.target }}/release/edupython.exe "$PWD/msix/EduPython-windows-x64.msix" "$version"

      - uses: actions/upload-artifact@v4
        if: runner.os == 'Windows'
        with:
          name: EduPython-windows-x64.msix
          path: msix/EduPython-windows-x64.msix

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: packaging/linux/make_tarball.sh target/${{ matrix.target }}/release/edupython dist/${{ matrix.artifact }}

      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: packaging/macos/make_dmg.sh target/${{ matrix.target }}/release/edupython dist/${{ matrix.artifact }}

      - uses: actions/upload-artifact@v4
        id: upload
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.artifact }}

      # Windows release: code signing by SignPath Foundation (free for open
      # source), so SmartScreen does not warn about the download. Every
      # release has to be approved in SignPath. Runs only once the repository
      # variable SIGNPATH_ORGANIZATION_ID and the secret SIGNPATH_API_TOKEN exist.
      - name: Sign (Windows, SignPath)
        if: runner.os == 'Windows' && startsWith(github.ref, 'refs/tags/') && vars.SIGNPATH_ORGANIZATION_ID != ''
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG || 'EduPython' }}
          signing-policy-slug: ${{ vars.SIGNPATH_POLICY_SLUG || 'release-signing' }}
          github-artifact-id: ${{ steps.upload.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 86400
          output-artifact-directory: signed

      - name: Use the signed exe (Windows)
        if: runner.os == 'Windows' && startsWith(github.ref, 'refs/tags/') && vars.SIGNPATH_ORGANIZATION_ID != ''
        run: cp signed/${{ matrix.artifact }} dist/${{ matrix.artifact }}

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/${{ matrix.artifact }}
            msix/*.msix
          name: EduPython ${{ github.ref_name }}
