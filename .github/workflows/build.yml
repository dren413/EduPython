name: Build EduPython

# Builds ready-to-run downloads with Python + pygame built in:
#   EduPython-windows-x64.exe   (portable, no installer)
#   EduPython-macos-arm64.dmg   (Apple Silicon)
#   EduPython-macos-x64.dmg     (Intel Macs)
# Push a tag like `v2.0.0` to publish them as a GitHub release.

on:
  push:
    tags: ['v2*']
    branches: [main]
    paths-ignore: ['**.md']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: EduPython-windows-x64.exe
          - os: macos-14
            target: aarch64-apple-darwin
            artifact: EduPython-macos-arm64.dmg
          - os: macos-15-intel   # macos-13 runners were retired
            target: x86_64-apple-darwin
            artifact: EduPython-macos-x64.dmg
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: . -> target

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Prepare built-in Python with pygame
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python packaging/prepare_python.py ${{ matrix.target }} "$PWD/python-runtime.zip"

      - name: Test
        run: cargo test --release --target ${{ matrix.target }}

      - name: Build
        run: |
          export EDUPYTHON_PYTHON_ZIP="$PWD/python-runtime.zip"
          cargo build --release --target ${{ matrix.target }} --features bundled-python
          mkdir -p dist

      - name: Package (Windows)
        if: runner.os == 'Windows'
        run: cp target/${{ matrix.target }}/release/edupython.exe dist/${{ matrix.artifact }}

      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: packaging/macos/make_dmg.sh target/${{ matrix.target }}/release/edupython dist/${{ matrix.artifact }}

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.artifact }}

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/${{ matrix.artifact }}
          name: EduPython ${{ github.ref_name }}
