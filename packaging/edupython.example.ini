; ---------------------------------------------------------------------------
; EduPython school settings
;
; Rename this file to  edupython.ini  and put it in the same folder as
; EduPython.exe (e.g. C:\Program Files\EduPython\). On a Mac, put it next to
; EduPython.app or in /Library/Application Support/EduPython/.
;
; Or keep the ini somewhere else and point to it from a Start-menu shortcut:
;   Target:  \\server\share\EduPython\EduPython.exe --config "\\server\config\edupython.ini"
; Then an update only replaces EduPython.exe; the ini stays where it is.
; A booklet can be given the same way:  --booklet "\\server\config\Python reference.pdf"
; (it wins over [booklet] below). Without any booklet, the one built into
; EduPython is shown.
;
; Pupils normally cannot change files there, so these settings are fixed.
; Relative paths are relative to this file's folder. You can use
; environment variables like %ProgramFiles% or %LOCALAPPDATA%.
; Lines starting with ; are comments.
; ---------------------------------------------------------------------------

[python]
; Python interpreters to use, in this order. The first one that works wins.
; Repeat "path =" as often as you like (or use path1, path2, ...).
path = %ProgramFiles%\Python313\python.exe
path = C:\Python313\python.exe

; If none of the paths above work: search this computer for Python? (yes/no)
fallback_search = yes

; May pupils choose another Python in File > Python Interpreter? (yes/no)
allow_change = no

; May pupils install pygame from inside EduPython (pip)? (yes/no)
allow_install = no

; Extra folders with Python packages, separated by ;  (added to PYTHONPATH)
; packages_path = \\server\python\site-packages

; Packages that should be available. EduPython checks them at start and
; shows missing ones (orange dot in the toolbar, details in Python Interpreter).
packages = pygame, numpy

[booklet]
; The exam booklet, shown with the "Booklet" button. Replace the PDF each
; school year; no new EduPython version is needed.
file = Python reference.pdf
title = Python Reference Guide

[display]
; Show file paths (Python program, package folders, this ini) to pupils? (yes/no)
; "no" hides network paths such as \\server\share\... in the app.
show_paths = no

[projects]
; Folder offered for every new project and in Open Project.
; Pupils can still choose another folder.
; folder = H:\Documents
