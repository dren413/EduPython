[package]
name = "pythonizer"
version = "2.0.0"
edition = "2024"
description = "A native Python editor for school: code, run, and see your classes as UML"
authors = ["Dren Gashi"]
build = "build.rs"

[dependencies]
dirs = "6"
eframe = "0.37"
rfd = "0.17"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
zip = { version = "9", default-features = false, features = ["deflate"], optional = true }

[features]
# Embed a zipped Python runtime (path in env var PYTHONIZER_PYTHON_ZIP at build time).
bundled-python = ["dep:zip"]

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
